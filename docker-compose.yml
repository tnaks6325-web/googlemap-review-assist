services:
  postgres:
    image: postgres:16-alpine
    container_name: review-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: review
    ports:
      - "5432:5432"
    volumes:
      - review_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  review_pgdata:
