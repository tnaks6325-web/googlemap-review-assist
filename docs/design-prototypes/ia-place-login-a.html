<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>아이에이 플레이스 — 관리자 로그인 시안</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #2878f0;
      --blue-dark: #0f5ed7;
      --ink: #182230;
      --muted: #6b788b;
      --line: #dfe6ef;
      font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: #edf2f7;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(520px, 1.15fr) minmax(430px, .85fr);
    }
    .brand-hero {
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: white;
      background:
        radial-gradient(circle at 20% 18%, rgba(127, 202, 255, .38), transparent 24rem),
        linear-gradient(145deg, #0755c9 0%, #2878f0 54%, #60a8ff 100%);
      isolation: isolate;
    }
    .brand-hero::before,
    .brand-hero::after {
      position: absolute;
      z-index: -1;
      content: "";
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 50%;
    }
    .brand-hero::before { width: 720px; height: 720px; top: -340px; right: -260px; }
    .brand-hero::after { width: 500px; height: 500px; bottom: -330px; left: -130px; }
    .map-lines {
      position: absolute;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      opacity: .28;
    }
    .brand-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      animation: arrive .7s cubic-bezier(.2,.8,.2,1) both;
    }
    .mark {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 28px;
      background: rgba(255,255,255,.15);
      box-shadow: inset 0 1px rgba(255,255,255,.28), 0 20px 55px rgba(1,48,120,.18);
      backdrop-filter: blur(18px);
      font-size: 23px;
      font-weight: 950;
      letter-spacing: -.09em;
    }
    .brand-lockup h1 {
      margin: 0;
      font-size: clamp(38px, 4vw, 60px);
      line-height: 1;
      letter-spacing: -.065em;
    }
    .login-side {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px;
      background: rgba(255,255,255,.97);
    }
    .login {
      width: min(100%, 390px);
      animation: arrive .7s .08s cubic-bezier(.2,.8,.2,1) both;
    }
    .mobile-brand { display: none; align-items: center; gap: 10px; margin-bottom: 42px; font-weight: 900; }
    .mobile-brand .mark { width: 38px; height: 38px; border: 0; border-radius: 13px; color: white; background: var(--blue); box-shadow: none; font-size: 10px; }
    .login small { color: var(--blue); font-size: 11px; font-weight: 900; letter-spacing: .12em; }
    .login h2 { margin: 11px 0 8px; font-size: 30px; letter-spacing: -.045em; }
    .login > p { margin: 0 0 32px; color: var(--muted); font-size: 14px; }
    .field { position: relative; margin-top: 13px; }
    .field label { display: block; margin: 0 0 8px 2px; color: #4f5e70; font-size: 12px; font-weight: 800; }
    .field input {
      width: 100%;
      height: 56px;
      padding: 0 50px 0 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: #fbfcfe;
      transition: border .2s, box-shadow .2s, background .2s;
    }
    .field input:focus {
      border-color: var(--blue);
      background: white;
      box-shadow: 0 0 0 4px rgba(40,120,240,.1);
    }
    .peek {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      color: #748195;
      background: transparent;
      font-size: 11px;
    }
    .peek:hover { color: var(--blue); background: #edf5ff; }
    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 2px 26px;
      color: var(--muted);
      font-size: 12px;
    }
    .option a { color: var(--blue); font-weight: 800; text-decoration: none; }
    .submit {
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 15px;
      color: white;
      background: linear-gradient(135deg, var(--blue-dark), #3d91ff);
      box-shadow: 0 13px 26px rgba(40,120,240,.24);
      font-weight: 900;
      transition: transform .18s, box-shadow .18s, opacity .18s;
    }
    .submit:hover { transform: translateY(-2px); box-shadow: 0 17px 31px rgba(40,120,240,.28); }
    .submit.busy { pointer-events: none; opacity: .7; }
    .secure { display: flex; justify-content: center; gap: 7px; margin-top: 24px; color: #8995a5; font-size: 11px; }
    .toast {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 10;
      padding: 14px 18px;
      border-radius: 13px;
      color: white;
      background: var(--ink);
      box-shadow: 0 15px 35px rgba(16,28,44,.22);
      opacity: 0;
      transform: translateY(18px);
      transition: .3s;
      font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    @keyframes arrive { from { opacity: 0; transform: translateY(16px); } }
    @media (max-width: 820px) {
      .page { display: block; min-height: 100vh; }
      .brand-hero { display: none; }
      .login-side { min-height: 100vh; padding: 34px 24px; }
      .mobile-brand { display: flex; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="brand-hero" aria-label="아이에이 플레이스">
      <svg class="map-lines" viewBox="0 0 900 900" preserveAspectRatio="none" aria-hidden="true">
        <path d="M-30 610C130 500 270 550 378 420S650 220 930 315" fill="none" stroke="white" stroke-width="2" stroke-dasharray="8 10"/>
        <path d="M70 130C250 280 450 120 860 560" fill="none" stroke="white" stroke-width="1.4" stroke-dasharray="5 12"/>
        <circle cx="378" cy="420" r="10" fill="white"/><circle cx="720" cy="285" r="7" fill="white"/>
      </svg>
      <div class="brand-lockup">
        <span class="mark" aria-hidden="true">IA</span>
        <h1>아이에이 플레이스</h1>
      </div>
    </section>

    <section class="login-side">
      <form class="login" id="admin-login">
        <div class="mobile-brand"><span class="mark" aria-hidden="true">IA</span> 아이에이 플레이스</div>
        <small>ADMIN</small>
        <h2>관리자 로그인</h2>
        <p>운영 계정으로 로그인해 주세요.</p>
        <div class="field">
          <label for="admin-email">이메일</label>
          <input id="admin-email" type="email" autocomplete="username" placeholder="admin@iaplace.kr" required />
        </div>
        <div class="field">
          <label for="admin-password">비밀번호</label>
          <input id="admin-password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required />
          <button class="peek" type="button" id="peek" aria-label="비밀번호 표시">보기</button>
        </div>
        <div class="option">
          <label><input type="checkbox" /> 이메일 기억하기</label>
          <a href="#help">로그인 도움</a>
        </div>
        <button class="submit" type="submit">로그인</button>
        <div class="secure"><span aria-hidden="true">◆</span> 안전하게 암호화된 연결</div>
      </form>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite">관리자 화면으로 이동할 준비가 됐습니다.</div>
  <script>
    const password = document.querySelector("#admin-password");
    const peek = document.querySelector("#peek");
    peek.addEventListener("click", () => {
      const hidden = password.type === "password";
      password.type = hidden ? "text" : "password";
      peek.textContent = hidden ? "숨김" : "보기";
      peek.setAttribute("aria-label", hidden ? "비밀번호 숨기기" : "비밀번호 표시");
    });
    document.querySelector("#admin-login").addEventListener("submit", (event) => {
      event.preventDefault();
      const button = document.querySelector(".submit");
      const original = button.textContent;
      button.classList.add("busy");
      button.textContent = "계정 확인 중…";
      setTimeout(() => {
        button.classList.remove("busy");
        button.textContent = original;
        const toast = document.querySelector("#toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2300);
      }, 900);
    });
  </script>
</body>
</html>
