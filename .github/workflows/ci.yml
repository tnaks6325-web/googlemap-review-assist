name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # 빌드(NODE_ENV=production)는 세션 시크릿 가드를 통과해야 함(운영 부팅 가드)
      SESSION_SECRET: "ci-placeholder-secret-please-change-32chars-minimum"
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
